name: Release

# Run by hand from the Actions tab on master: tag the release from the version in Cargo.toml, build dee_shim on each system, package it with its captured help
# (tools/package_release.py), and attach the packages to a draft GitHub release to review and
# publish by hand. The release notes are the tag's section of CHANGELOG.md.

on:
  workflow_dispatch:

# Two dispatches at once would race to tag and draft the same release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  version:
    # Cargo.toml names the release: a build without Git history carries its version, so the tag
    # is made from it. The annotated tag is created at the dispatched commit (or reused there, so
    # a rerun works) after the changelog check, so a failed check leaves no tag.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read the version
        id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check the changelog has notes for the tag
        run: python3 tools/release_notes.py "${{ steps.tag.outputs.tag }}" > /dev/null
      - name: Tag the dispatched commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "dispatch the release from master, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "$TAG already tags another commit; bump the version in Cargo.toml" >&2
              exit 1
            fi
            if [ "$(git cat-file -t "$TAG")" != tag ]; then
              echo "$TAG is a lightweight tag; -V reads only annotated tags" >&2
              exit 1
            fi
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "dee-shim $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: rockylinux/rockylinux:9
    steps:
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False git gcc python3.11
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore annotated tags
        # A checkout of a tag can leave that tag lightweight; the version label reads only
        # annotated tags.
        run: git fetch --force --tags origin
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --default-toolchain "$RUST_TOOLCHAIN"
          # The image declares no PATH, so a GITHUB_PATH entry alone would become the whole PATH
          # of later steps; carry the container's own PATH over first.
          echo "$PATH" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        # Panic locations carry source paths; remap the home and checkout out of the binary.
        run: |
          RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$PWD=." \
            cargo build --locked --release -p dee_shim
      - name: Package
        run: |
          python3.11 tools/package_release.py --build-dir target/release --platform linux \
            --commit "$GITHUB_SHA" --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - name: Restore annotated tags
        # A checkout of a tag can leave that tag lightweight; the version label reads only
        # annotated tags.
        run: git fetch --force --tags origin
      - name: Install Rosetta 2
        # The packager runs the x86_64 binary to capture its help.
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        run: |
          RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$PWD=." \
            cargo build --locked --release -p dee_shim --target x86_64-apple-darwin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Package
        run: |
          python3 tools/package_release.py --build-dir target/x86_64-apple-darwin/release \
            --platform macos --commit "$GITHUB_SHA" --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.tar.gz

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - name: Restore annotated tags
        # A checkout of a tag can leave that tag lightweight; the version label reads only
        # annotated tags.
        run: git fetch --force --tags origin
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        # rustc sees Windows paths, so remap those forms of the home and checkout.
        run: |
          home=$(cygpath -w "$HOME"); here=$(cygpath -w "$PWD")
          RUSTFLAGS="--remap-path-prefix=$home=~ --remap-path-prefix=$here=." \
            cargo build --locked --release -p dee_shim
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Package
        run: |
          python tools/package_release.py --build-dir target/release --platform windows \
            --commit "$GITHUB_SHA" --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Take the release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "$TAG" > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "dee-shim $TAG" --notes-file notes.md
